  - id: anomalias_despesas
    name: Deteção de anomalias em despesas
    area: financas
    areas: [financas, risco]
    problem_type: anomaly_detection
    maturity: intermédio
    summary: Encontrar lançamentos de despesa invulgares para revisão por controlo de gestão/auditoria.
    business_question: Que lançamentos de despesa fogem ao padrão habitual e merecem revisão?
    decision: "Enviar os lançamentos mais anómalos para revisão manual (ex.: 1-2% por mês)."
    unit: Lançamento contabilístico
    target:
      column: null
      definition: Sem alvo; a coluna "anomalia" do demo serve apenas para validar.
    horizon: n/a
    typical_features: [Valor, Categoria, Centro de custo, Aprovador, Hora e dia do lançamento, Tempo de aprovação]
    data_requirements: [Lançamentos com atributos de contexto]
    demo:
      connector: demo
      workspace: ws-financas
      dataset: ds-financas
      table: Despesas
      id_columns: [lancamento_id]
      label_column: anomalia
      exclude: [anomalia]
    recommended_models:
      - model: isolation_forest
        why: Eficiente em muitas dimensões, não assume distribuições.
      - model: local_outlier_factor
        why: Deteta anomalias locais (normais no global, estranhas no seu grupo).
      - model: robust_zscore
        why: Regra simples e explicável por variável.
    metrics:
      primary: precision_at_k
      secondary: [recall_at_k]
      business: "% de lançamentos revistos que eram efetivamente irregulares."
    profile:
      interpretability: alta
      expected_anomaly_rate: 0.02
      goal: interpretabilidade
    pitfalls:
      - Anomalia ≠ fraude — é um sinal para revisão humana.
      - Contaminação demasiado alta sobrecarrega a equipa de revisão.
    powerbi_output:
      table: Anomalias_Despesas
      columns: [lancamento_id, score_anomalia, e_anomalia, motivos, versao_modelo]
      visuals: [Lista de revisão priorizada, Anomalias por centro de custo]
      measures:
        - name: Lançamentos a Rever
          dax: "Lançamentos a Rever = CALCULATE(COUNTROWS(Anomalias_Despesas), Anomalias_Despesas[e_anomalia] = TRUE())"
    ai_act_risk: mínimo
    sensitive_attributes: []
    terms: [anomalia, isolation_forest, contaminacao, human_in_the_loop]

  # ------------------------------------------------------------------ RISCO
  - id: risco_credito
    name: Risco de incumprimento de crédito
    area: risco
    areas: [risco, financas]
    problem_type: binary_classification
    maturity: avançado
    summary: Estimar a probabilidade de incumprimento (PD) de pedidos de crédito.
    business_question: Qual a probabilidade de este pedido de crédito entrar em incumprimento em 12 meses?
    decision: Aprovar, rejeitar ou ajustar condições (taxa, garantias) com base na PD.
    unit: Pedido de crédito na data de decisão
    target:
      column: incumprimento
      definition: 1 se houve atraso > 90 dias nos 12 meses após a concessão.
      positive_class: 1
    horizon: 12 meses
    typical_features:
      - Taxa de esforço e rendimento
      - Histórico de crédito e incumprimentos anteriores
      - Estabilidade de emprego
      - Montante, prazo e finalidade
    data_requirements:
      - Apenas pedidos aprovados têm resultado (cuidado com o viés de rejeição)
      - Documentação do modelo para auditoria e regulador
    demo:
      connector: demo
      workspace: ws-financas
      dataset: ds-risco
      table: Credito
      target: incumprimento
      id_columns: [pedido_id]
    recommended_models:
      - model: logistic_regression
        why: Padrão de mercado em scorecards — totalmente explicável e auditável.
      - model: lightgbm
        why: Maior poder preditivo; usar com explicabilidade e restrições monotónicas.
      - model: hist_gradient_boosting
        why: Alternativa sem dependências externas.
    metrics:
      primary: roc_auc
      secondary: [pr_auc, brier, ks]
      business: Perda esperada = PD × LGD × EAD; taxa de aprovação vs taxa de incumprimento.
    profile:
      interpretability: alta
      imbalance: forte
      regulated: true
      goal: interpretabilidade
    business_costs: {cost_fp: 300, cost_fn: 4000, benefit_tp: 4000}
    pitfalls:
      - Usar variáveis proibidas ou proxies de discriminação (género, nacionalidade).
      - Ignorar o viés de rejeição (reject inference).
      - Probabilidades mal calibradas tornam a PD inútil para pricing.
    powerbi_output:
      table: Score_Credito
      columns: [pedido_id, pd, classe_risco, principais_motivos, versao_modelo]
      visuals: [Distribuição por classe de risco, Taxa de aprovação simulada por limiar]
      measures:
        - name: PD Média
          dax: "PD Média = AVERAGE(Score_Credito[pd])"
        - name: Perda Esperada
          dax: "Perda Esperada = SUMX(Score_Credito, Score_Credito[pd] * RELATED(Credito[montante]) * 0.45)"
    ai_act_risk: alto
    sensitive_attributes: [genero, idade, estado_civil]
    terms: [pd, ks_estatistica, calibracao, ai_act, fairness, gini, brier_score]

  - id: fraude_transacoes
    name: Deteção de fraude em transações
    area: risco
    areas: [risco, financas]
    problem_type: binary_classification
    maturity: avançado
    summary: Identificar transações fraudulentas com classes extremamente desequilibradas (~1%).
    business_question: Que transações têm alta probabilidade de ser fraude e devem ser bloqueadas ou revistas?
    decision: Bloquear automaticamente (risco muito alto) ou enviar para revisão (risco alto).
    unit: Transação
    target:
      column: fraude
      definition: 1 se a transação foi confirmada como fraudulenta.
      positive_class: 1
    horizon: Tempo real / quase real
    typical_features:
      - Desvio do montante face ao padrão do cliente
      - Velocidade (nº de transações nas últimas 24h)
      - Distância a casa, país, novo dispositivo
      - Canal e categoria do comerciante
    data_requirements:
      - Rótulos de fraude confirmados (chargebacks, investigação)
      - Ordem temporal preservada na validação
    demo:
      connector: demo
      workspace: ws-financas
      dataset: ds-risco
      table: Transacoes
      target: fraude
      id_columns: [transacao_id]
      time_column: data_hora
    recommended_models:
      - model: xgboost
        why: Excelente em dados muito desequilibrados com scale_pos_weight.
      - model: lightgbm
        why: Rápido para grandes volumes de transações.
      - model: isolation_forest
        why: Complemento não supervisionado para fraude nova (sem rótulos).
    metrics:
      primary: pr_auc
      secondary: [recall, precision, roc_auc]
      business: Valor de fraude evitado − custo de revisão − fricção de clientes bloqueados.
    profile:
      interpretability: média
      imbalance: extremo
      goal: performance
    business_costs: {cost_fp: 8, cost_fn: 450, benefit_tp: 450}
    pitfalls:
      - A accuracy é inútil (99% de accuracy dizendo "nunca é fraude").
      - Validação aleatória sobrestima o desempenho — usar divisão temporal.
      - Oversampling antes da divisão treino/teste contamina a avaliação.
    powerbi_output:
      table: Score_Fraude
      columns: [transacao_id, probabilidade, acao_recomendada, principais_motivos, versao_modelo]
      visuals: [Alertas por hora e canal, Precisão dos alertas ao longo do tempo]
      measures:
        - name: Alertas de Fraude
          dax: "Alertas = CALCULATE(COUNTROWS(Score_Fraude), Score_Fraude[acao_recomendada] <> \"Aprovar\")"
    ai_act_risk: limitado
    sensitive_attributes: []
    terms: [fraude, desequilibrio_classes, pr_auc, scale_pos_weight, validacao_temporal, recall]

