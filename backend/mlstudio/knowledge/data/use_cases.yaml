      definition: Contagem de tickets abertos por dia (agregação por contagem).
    horizon: 28 dias
    typical_features: [Dia da semana, Sazonalidade, Campanhas e faturação, Feriados]
    data_requirements: [Tickets com data de abertura]
    demo:
      connector: demo
      workspace: ws-pessoas
      dataset: ds-cliente
      table: Tickets
      time_column: data_abertura
      value_column: ticket_id
      aggregation: count
      series_columns: []
      freq: D
      horizon: 28
    recommended_models:
      - model: holt_winters
        why: Forte sazonalidade semanal.
      - model: gbm_lags
        why: Incorpora calendário e eventos.
      - model: seasonal_naive
        why: Base de comparação.
    metrics:
      primary: wape
      secondary: [mae, bias]
      business: Nível de serviço (atendidas em < 60s) e custo de horas extra.
    profile:
      seasonality: semanal
      goal: equilibrado
    pitfalls:
      - Picos causados por incidentes devem ser marcados como eventos.
    powerbi_output:
      table: Previsao_Contactos
      columns: [data, previsao, limite_inferior, limite_superior, versao_modelo]
      visuals: [Previsão vs capacidade planeada]
      measures:
        - name: Contactos Previstos
          dax: "Contactos Previstos = SUM(Previsao_Contactos[previsao])"
    ai_act_risk: mínimo
    sensitive_attributes: []
    terms: [serie_temporal, sazonalidade, wape, intervalo_previsao]

  - id: tempo_resolucao
    name: Tempo de resolução de tickets
    area: cliente
    areas: [cliente]
    problem_type: regression
    maturity: intermédio
    summary: Estimar o tempo de resolução de cada ticket à entrada.
    business_question: Quanto tempo vai demorar a resolver este ticket?
    decision: Priorizar e encaminhar tickets e informar o cliente.
    unit: Ticket
    target:
      column: tempo_resolucao_horas
      definition: Horas entre a abertura e a resolução.
    horizon: n/a
    typical_features: [Categoria, Prioridade, Canal, Segmento, Nível do agente]
    data_requirements: [Tickets fechados]
    demo:
      connector: demo
      workspace: ws-pessoas
      dataset: ds-cliente
      table: Tickets
      target: tempo_resolucao_horas
      id_columns: [ticket_id]
      exclude: [escalado, reaberto, n_interacoes]
    recommended_models:
      - model: lightgbm
        why: Alvo assimétrico e interações categoria × prioridade.
      - model: random_forest
        why: Robusto.
      - model: ridge
        why: Base.
    metrics:
      primary: mae
      secondary: [rmse, r2]
      business: Cumprimento de SLA.
    profile:
      interpretability: média
      skewed_target: true
      goal: equilibrado
    pitfalls:
      - Variáveis conhecidas só no fecho (reaberto, nº de interações) causam leakage.
    powerbi_output:
      table: Previsao_Resolucao
      columns: [ticket_id, horas_previstas, risco_sla, versao_modelo]
      visuals: [Tickets em risco de SLA]
      measures:
        - name: Tickets em Risco SLA
          dax: "Risco SLA = CALCULATE(COUNTROWS(Previsao_Resolucao), Previsao_Resolucao[risco_sla] = TRUE())"
    ai_act_risk: mínimo
    sensitive_attributes: []
    terms: [regressao, mae, data_leakage, sla]

  - id: drivers_nps
    name: Drivers de satisfação (NPS)
    area: cliente
    areas: [cliente, marketing]
    problem_type: multiclass_classification
    maturity: intermédio
    summary: Perceber o que distingue promotores, passivos e detratores.
    business_question: Que fatores mais influenciam um cliente a ser detrator ou promotor?
    decision: Priorizar investimentos nos drivers com maior impacto no NPS.
    unit: Resposta ao inquérito
    target:
      column: categoria_nps
      definition: Promotor (9-10), Passivo (7-8), Detrator (0-6).
    horizon: n/a
    typical_features: [Avaliações de atributos (preço, qualidade, atendimento, app), Contactos ao apoio, Problemas de faturação, Avarias]
    data_requirements: [Inquéritos ligados a dados operacionais do cliente]
    demo:
      connector: demo
      workspace: ws-pessoas
      dataset: ds-cliente
      table: NPS
      target: categoria_nps
      id_columns: [resposta_id, cliente_id]
      exclude: [nota_nps]
    recommended_models:
      - model: random_forest
        why: Importância de drivers estável.
      - model: logistic_regression
        why: Efeitos diretos e interpretáveis por driver.
      - model: lightgbm
        why: Melhor desempenho.
    metrics:
      primary: f1_macro
      secondary: [balanced_accuracy, accuracy]
      business: Importância de cada driver e simulação de impacto no NPS.
    profile:
      interpretability: alta
      goal: interpretabilidade
    pitfalls:
      - Incluir a nota NPS (0-10) como feature — define o próprio alvo.
      - Correlação ≠ causalidade; validar drivers com testes/ações.
    powerbi_output:
      table: Drivers_NPS
      columns: [driver, importancia, efeito]
      visuals: [Barras de importância dos drivers, Matriz importância × desempenho]
      measures:
        - name: NPS
          dax: "NPS = DIVIDE(CALCULATE(COUNTROWS(NPS), NPS[categoria_nps] = \"Promotor\") - CALCULATE(COUNTROWS(NPS), NPS[categoria_nps] = \"Detrator\"), COUNTROWS(NPS)) * 100"
    ai_act_risk: mínimo
    sensitive_attributes: []
    terms: [nps, importancia_features, f1_score, causalidade]

  # ------------------------------------------------------------------ PRICING
  - id: elasticidade_preco
    name: Elasticidade preço-procura
    area: pricing
    areas: [pricing, comercial, operacoes]
    problem_type: regression
    maturity: avançado
    summary: Estimar como as unidades vendidas reagem a variações de preço e promoções.
    business_question: Quanto variam as vendas quando alteramos o preço em 1%?
    decision: Definir preços e profundidade de descontos que maximizam margem.
    unit: Loja × família × dia
    target:
      column: unidades
      definition: Unidades vendidas por dia (modelação log-log para obter elasticidade).
    horizon: n/a
    typical_features: [Preço médio, Desconto, Promoção, Calendário, Família, Loja]
    data_requirements: [Variação de preço suficiente no histórico]
    demo:
      connector: demo
      workspace: ws-comercial
      dataset: ds-vendas
      table: VendasDiarias
      target: unidades
      id_columns: []
      exclude: [receita]
    recommended_models:
      - model: ridge
        why: Modelo log-log em que o coeficiente do log(preço) é a elasticidade.
      - model: lightgbm
        why: Captura efeitos não lineares; usar curvas de dependência parcial (PDP).
      - model: elastic_net
        why: Regularização com muitas variáveis de calendário.
    metrics:
      primary: mae
      secondary: [r2, rmse]
      business: Elasticidade por família e margem simulada por cenário de preço.
    profile:
      interpretability: alta
      skewed_target: true
      goal: interpretabilidade
    pitfalls:
      - Preço e promoção correlacionados — separar efeitos.
      - Endogeneidade (preços baixos onde a procura já é baixa).
    powerbi_output:
      table: Elasticidades
      columns: [familia, elasticidade, intervalo_confianca]
      visuals: [Curva preço × procura simulada, Elasticidade por família]
      measures:
        - name: Elasticidade Média
          dax: "Elasticidade Média = AVERAGE(Elasticidades[elasticidade])"
    ai_act_risk: mínimo
    sensitive_attributes: []
    terms: [elasticidade, transformacao_log, pdp, multicolinearidade, causalidade]

  # ------------------------------------------------------------------ MANUTENÇÃO
  - id: manutencao_preditiva
    name: Manutenção preditiva
    area: manutencao
    areas: [manutencao, operacoes]
    problem_type: binary_classification
    maturity: avançado
    summary: Prever falhas de equipamentos nos próximos 7 dias a partir de sensores.
    business_question: Que equipamentos vão falhar nos próximos 7 dias?
    decision: Agendar manutenção antes da falha, minimizando paragens não planeadas.
    unit: Equipamento × leitura
    target:
      column: falha_7d
      definition: 1 se o equipamento falhou nos 7 dias seguintes à leitura.
      positive_class: 1
    horizon: 7 dias
    typical_features: [Temperatura, Vibração, Pressão, Horas desde a manutenção, Carga, Alarmes recentes]
    data_requirements: [Telemetria com histórico de avarias datado]
    demo:
      connector: demo
      workspace: ws-operacoes
      dataset: ds-fabrica
      table: Sensores
      target: falha_7d
      id_columns: [leitura_id]
      time_column: data_hora
      exclude: [anomalia]
    recommended_models:
      - model: lightgbm
        why: Capta combinações de sinais (vibração alta + muitas horas sem manutenção).
      - model: random_forest
        why: Robusto a ruído de sensores.
      - model: logistic_regression
        why: Base interpretável.
    metrics:
      primary: recall
      secondary: [precision, pr_auc]
      business: Custo de paragem evitado − custo de intervenções antecipadas.
    profile:
      interpretability: média
      imbalance: forte
      goal: performance
    business_costs: {cost_fp: 300, cost_fn: 6000, benefit_tp: 5000}
    pitfalls:
      - Leituras do mesmo equipamento no treino e no teste (fuga temporal) — dividir por tempo.
    powerbi_output:
      table: Risco_Falha
      columns: [equipamento, probabilidade, acao_recomendada, principais_motivos, versao_modelo]
      visuals: [Mapa de equipamentos por risco, Tendência de risco por linha]
      measures:
        - name: Equipamentos em Risco
          dax: "Equipamentos em Risco = CALCULATE(DISTINCTCOUNT(Risco_Falha[equipamento]), Risco_Falha[probabilidade] > 0.5)"
    ai_act_risk: mínimo
    sensitive_attributes: []
    terms: [manutencao_preditiva, recall, validacao_temporal, desequilibrio_classes]

  - id: anomalias_sensores
    name: Anomalias em sensores
    area: manutencao
    areas: [manutencao]
    problem_type: anomaly_detection
    maturity: intermédio
    summary: Detetar leituras de sensores anómalas para investigação precoce.
    business_question: Que leituras fogem ao comportamento normal do equipamento?
    decision: Abrir ordens de inspeção para as leituras mais anómalas.
    unit: Leitura
    target:
      column: null
      definition: Sem alvo; "anomalia" no demo serve para validar.
    horizon: n/a
    typical_features: [Temperatura, Vibração, Pressão, Rotação, Consumo de energia]
    data_requirements: [Leituras em operação normal suficientes]
    demo:
      connector: demo
      workspace: ws-operacoes
      dataset: ds-fabrica
      table: Sensores
      id_columns: [leitura_id]
      label_column: anomalia
      exclude: [falha_7d, anomalia]
    recommended_models:
      - model: isolation_forest
        why: Escalável e sem suposições de distribuição.
      - model: local_outlier_factor
        why: Anomalias relativas ao tipo de equipamento.
      - model: robust_zscore
        why: Simples e explicável por sensor.
    metrics:
      primary: precision_at_k
      secondary: [recall_at_k]
      business: Inspeções úteis / inspeções totais.
    profile:
      interpretability: alta
      expected_anomaly_rate: 0.03
      goal: interpretabilidade
    pitfalls:
      - Comparar equipamentos de tipos diferentes na mesma escala.
    powerbi_output:
      table: Anomalias_Sensores
      columns: [leitura_id, equipamento, score_anomalia, e_anomalia, motivos, versao_modelo]
      visuals: [Linha temporal com anomalias destacadas]
      measures:
        - name: Leituras Anómalas
          dax: "Leituras Anómalas = CALCULATE(COUNTROWS(Anomalias_Sensores), Anomalias_Sensores[e_anomalia] = TRUE())"
    ai_act_risk: mínimo
    sensitive_attributes: []
    terms: [anomalia, isolation_forest, lof, contaminacao]
