    business_question: Que fatores explicam a saída voluntária e onde está o risco concentrado?
    decision: Desenhar políticas de retenção (salário, progressão, teletrabalho) e conversas de carreira.
    unit: Colaborador na data de corte
    target:
      column: saiu_12m
      definition: 1 se o colaborador saiu voluntariamente nos 12 meses seguintes.
      positive_class: 1
    horizon: 12 meses
    typical_features: [Rácio salário/mercado, Anos desde a última promoção, Satisfação, Horas extra, Distância a casa, Teletrabalho]
    data_requirements: [Histórico de saídas voluntárias com motivo, Dados pseudonimizados]
    demo:
      connector: demo
      workspace: ws-pessoas
      dataset: ds-rh
      table: Colaboradores
      target: saiu_12m
      id_columns: [colaborador_id]
      exclude: [dias_ausencia_prox_trimestre]
    recommended_models:
      - model: logistic_regression
        why: Fatores explicáveis — essencial em decisões sobre pessoas.
      - model: random_forest
        why: "Capta interações (ex.: horas extra × satisfação)."
      - model: lightgbm
        why: Melhor desempenho; usar sobretudo para análise de drivers agregados.
    metrics:
      primary: roc_auc
      secondary: [recall, pr_auc]
      business: Custo de substituição evitado (≈ 6 a 9 meses de salário por saída).
    profile:
      interpretability: alta
      imbalance: moderado
      regulated: true
      goal: interpretabilidade
    business_costs: {cost_fp: 200, cost_fn: 15000, benefit_tp: 7000}
    pitfalls:
      - Uso individual do score pode ser discriminatório — preferir análise agregada e políticas.
      - Género, idade e estado civil não devem ser usados para decisões individuais.
      - Sistema de alto risco segundo o AI Act (gestão de trabalhadores).
    powerbi_output:
      table: Risco_Attrition
      columns: [departamento, nivel, risco_medio, n_colaboradores_risco_alto, principais_fatores]
      visuals: [Risco médio por departamento (agregado), Principais drivers de saída]
      measures:
        - name: Risco Médio de Saída
          dax: "Risco Médio = AVERAGE(Risco_Attrition[risco_medio])"
    ai_act_risk: alto
    sensitive_attributes: [genero, idade, estado_civil]
    terms: [attrition, fairness, ai_act, rgpd, pseudonimizacao, importancia_features]

