    business_question: Quanto vamos receber por dia nas próximas 8 semanas?
    decision: Planear financiamento de curto prazo e aplicações de excedentes.
    unit: Dia
    target:
      column: recebimentos
      definition: Total de recebimentos por dia útil.
    horizon: 56 dias
    typical_features: [Calendário (dia do mês, dia útil), Sazonalidade mensal, Feriados]
