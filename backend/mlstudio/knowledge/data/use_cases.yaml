# Casos de uso de negócio. Cada caso especializa os agentes:
#  - framing: pergunta de negócio, alvo, decisão e KPIs
#  - selection/advisor: modelos recomendados e perfil (interpretabilidade, desequilíbrio...)
#  - evaluation: custos/benefícios de negócio para escolher o limiar
#  - deployment: tabela, medidas DAX e visuais recomendados no Power BI
#  - governance: nível de risco (AI Act) e atributos sensíveis
#
# O bloco "demo" aponta para um conjunto de dados sintético do conector demo,
# para que a equipa possa treinar o fluxo completo sem dados reais.
use_cases:
  # ------------------------------------------------------------------ MARKETING
  - id: churn_clientes
    name: Previsão de churn de clientes
    area: marketing
    areas: [marketing, comercial, cliente]
    problem_type: binary_classification
    maturity: básico
    summary: Identificar clientes com elevada probabilidade de cancelar para agir antes da saída.
    business_question: Que clientes têm maior probabilidade de cancelar nos próximos 90 dias?
    decision: >-
      Selecionar os clientes a incluir na campanha de retenção (ex.: top 10% de
      risco) e escolher a oferta adequada a cada um.
    unit: Cliente na data de corte
    target:
      column: churn
      definition: 1 se o cliente cancelou nos 90 dias seguintes à data de corte; 0 caso contrário.
      positive_class: 1
    horizon: 90 dias
    typical_features:
      - Antiguidade e tipo de plano/contrato
      - Tendência de consumo (variação nos últimos 3 meses)
      - Reclamações e contactos com o apoio ao cliente
      - Recência, frequência e valor de compras (RFM)
      - Meses até ao fim da fidelização
      - Atrasos de pagamento
    data_requirements:
      - Histórico de pelo menos 12 meses
      - Data de corte clara; features calculadas apenas com informação anterior a essa data
      - Pelo menos ~500 casos positivos (churners) para resultados estáveis
    demo:
      connector: demo
      workspace: ws-comercial
      dataset: ds-crm
      table: Clientes
      target: churn
      id_columns: [cliente_id]
      exclude: [valor_futuro_12m, aderiu_cross_sell]
    recommended_models:
      - model: lightgbm
        why: Melhor desempenho típico em dados tabulares com interações não lineares; rápido.
      - model: logistic_regression
        why: Base interpretável; coeficientes fáceis de comunicar ao marketing.
      - model: random_forest
        why: Robusto com pouca afinação; bom ponto de comparação.
    metrics:
      primary: roc_auc
      secondary: [pr_auc, recall, lift_top_decile]
      business: Receita retida líquida = clientes salvos × valor do cliente − custo das ofertas.
    profile:
      interpretability: média
      imbalance: moderado
      goal: equilibrado
      latency: batch mensal
    business_costs:
      cost_fp: 15
      cost_fn: 220
      benefit_tp: 120
      note: Valores face a não agir — FP = oferta dada a quem não ia sair (15€); VP = margem retida líquida da oferta (120€); FN = margem perdida de um churner não detetado (220€).
    pitfalls:
      - "Data leakage: incluir colunas preenchidas após o cancelamento (ex.: motivo de saída, data de rescisão)."
      - Avaliar só pela accuracy — com 18% de churn um modelo que diz sempre "não sai" tem 82% de accuracy.
      - Esquecer que clientes em campanha de retenção têm comportamento alterado.
    powerbi_output:
      table: Previsoes_Churn
      columns: [cliente_id, probabilidade, banda_risco, principais_motivos, versao_modelo, data_scoring]
      visuals:
        - Matriz de clientes por banda de risco × segmento
        - Gráfico de barras com os principais motivos de risco
        - Tabela de ação (top 100 clientes) com motivos e valor em risco
        - Cartão KPI com receita em risco
      measures:
        - name: Clientes em Risco Alto
          dax: "Clientes em Risco Alto = CALCULATE(COUNTROWS(Previsoes_Churn), Previsoes_Churn[banda_risco] = \"Alto\")"
        - name: Probabilidade Média de Churn
          dax: "Prob. Média Churn = AVERAGE(Previsoes_Churn[probabilidade])"
        - name: Receita em Risco
          dax: "Receita em Risco = SUMX(Previsoes_Churn, Previsoes_Churn[probabilidade] * RELATED(Clientes[mensalidade]) * 12)"
    ai_act_risk: mínimo
    sensitive_attributes: [genero, idade]
    terms: [churn, data_corte, data_leakage, auc_roc, lift, limiar_decisao, campanha_retencao]

  - id: segmentacao_clientes
    name: Segmentação comportamental de clientes (RFM)
    area: marketing
    areas: [marketing, comercial]
    problem_type: clustering
    maturity: básico
    summary: Agrupar clientes por comportamento de compra para personalizar comunicação e ofertas.
    business_question: Que grupos naturais de clientes existem e como se comportam?
    decision: "Definir estratégias e ofertas diferenciadas por segmento (ex.: fidelizar, reativar, desenvolver)."
    unit: Cliente
    target:
      column: null
      definition: Não existe alvo — aprendizagem não supervisionada.
    horizon: n/a
    typical_features:
      - Recência (dias desde a última compra)
      - Frequência (nº de compras em 12 meses)
      - Valor monetário (gasto em 12 meses)
      - Nº de produtos, utilização de canais digitais
    data_requirements:
      - Variáveis numéricas comparáveis (normalizadas pelo agente)
      - Evitar demasiadas variáveis — 4 a 10 é o ideal para segmentos interpretáveis
    demo:
      connector: demo
      workspace: ws-comercial
      dataset: ds-crm
      table: Clientes
      target: null
      id_columns: [cliente_id]
      features: [dias_desde_ultima_compra, n_compras_12m, valor_compras_12m, n_produtos, antiguidade_meses, mensalidade]
    recommended_models:
      - model: kmeans
        why: Simples, rápido e produz segmentos fáceis de descrever pelo centróide.
      - model: gaussian_mixture
        why: Permite segmentos de formas e tamanhos diferentes e probabilidades de pertença.
      - model: agglomerative
        why: Útil para explorar hierarquias de segmentos em bases pequenas.
    metrics:
      primary: silhouette
      secondary: [davies_bouldin, calinski_harabasz]
      business: Diferença de valor/ comportamento entre segmentos e capacidade de ação.
    profile:
      interpretability: alta
      goal: interpretabilidade
    pitfalls:
      - Não normalizar as variáveis — o valor monetário domina a distância.
      - Escolher demasiados segmentos (>8) que o negócio não consegue operacionalizar.
      - Variáveis muito assimétricas sem transformação logarítmica.
    powerbi_output:
      table: Segmentos_Clientes
      columns: [cliente_id, segmento, nome_segmento, distancia_centro, versao_modelo]
      visuals:
        - Gráfico de dispersão Frequência × Valor colorido por segmento
        - Tabela de perfil por segmento (médias)
        - Treemap com nº de clientes e receita por segmento
      measures:
        - name: Receita por Segmento
          dax: "Receita Segmento = CALCULATE(SUM(Clientes[valor_compras_12m]))"
        - name: Peso do Segmento
          dax: "% Clientes = DIVIDE(COUNTROWS(Segmentos_Clientes), CALCULATE(COUNTROWS(Segmentos_Clientes), ALL(Segmentos_Clientes)))"
    ai_act_risk: mínimo
    sensitive_attributes: []
    terms: [clustering, rfm, kmeans, silhueta, standardizacao, perfil_segmento]

  - id: clv
    name: Valor futuro do cliente (CLV)
    area: marketing
    areas: [marketing, comercial, financas]
    problem_type: regression
    maturity: intermédio
    summary: Estimar quanto cada cliente vai gerar nos próximos 12 meses.
    business_question: Quanto valor (margem/receita) vai cada cliente gerar no próximo ano?
    decision: Priorizar investimento de aquisição e retenção nos clientes de maior valor futuro.
    unit: Cliente na data de corte
    target:
      column: valor_futuro_12m
      definition: Receita gerada pelo cliente nos 12 meses seguintes à data de corte.
    horizon: 12 meses
    typical_features:
      - RFM histórico
      - Plano, nº de produtos e mensalidade
      - Antiguidade e canal de aquisição
      - Tendência de consumo
    data_requirements:
      - Histórico ≥ 24 meses (12 para features + 12 para o alvo)
    demo:
      connector: demo
      workspace: ws-comercial
      dataset: ds-crm
      table: Clientes
      target: valor_futuro_12m
      id_columns: [cliente_id]
      exclude: [churn, aderiu_cross_sell]
    recommended_models:
      - model: lightgbm
        why: Capta relações não lineares entre RFM e valor futuro.
      - model: ridge
        why: Base linear robusta e interpretável.
      - model: random_forest
        why: Comparação robusta com pouca afinação.
    metrics:
      primary: mae
      secondary: [rmse, r2, wape]
      business: Erro médio em euros por cliente e capacidade de ordenar os clientes (top 20% de valor).
    profile:
      interpretability: média
      skewed_target: true
      goal: equilibrado
    pitfalls:
      - O alvo é muito assimétrico (poucos clientes valem muito) — considere transformação log.
      - Clientes que saíram têm valor futuro 0 — decidir se se modela em duas fases (churn × valor).
    powerbi_output:
      table: Previsoes_CLV
      columns: [cliente_id, valor_previsto_12m, decil_valor, versao_modelo]
      visuals:
        - Distribuição do valor previsto por decil
        - Matriz valor previsto × risco de churn (quadrantes)
      measures:
        - name: Valor Futuro Total
          dax: "Valor Futuro Total = SUM(Previsoes_CLV[valor_previsto_12m])"
    ai_act_risk: mínimo
    sensitive_attributes: [genero, idade]
    terms: [clv, regressao, mae, transformacao_log, assimetria]

  - id: resposta_campanha
    name: Propensão de resposta a campanha
    area: marketing
    areas: [marketing]
    problem_type: binary_classification
    maturity: intermédio
    summary: Prever que clientes vão responder a uma campanha para enviar só a quem interessa.
    business_question: Que clientes têm maior probabilidade de responder à próxima campanha?
    decision: "Definir a lista de envio (ex.: top 30%) e o canal, maximizando o ROI da campanha."
    unit: Cliente × campanha
    target:
      column: respondeu
      definition: 1 se o cliente converteu na campanha (compra/adesão) dentro da janela da campanha.
      positive_class: 1
    horizon: Duração da campanha
    typical_features:
      - Resposta a campanhas anteriores
      - Canal, hora e dia de envio
      - Desconto oferecido
      - RFM do cliente
    data_requirements:
      - Histórico de várias campanhas com resultados registados
      - Idealmente um grupo de controlo aleatório para medir uplift
    demo:
      connector: demo
      workspace: ws-comercial
      dataset: ds-crm
      table: Campanhas
      target: respondeu
      id_columns: [cliente_id]
    recommended_models:
      - model: lightgbm
        why: Lida bem com o desequilíbrio (≈9% de resposta) e interações canal × segmento.
      - model: logistic_regression
        why: Coeficientes interpretáveis por canal e desconto.
      - model: hist_gradient_boosting
        why: Alternativa nativa do scikit-learn, sem dependências.
    metrics:
      primary: pr_auc
      secondary: [roc_auc, lift_top_decile, precision]
      business: ROI = (respostas × margem − envios × custo de envio) / custo.
    profile:
      interpretability: média
      imbalance: forte
      goal: performance
    business_costs:
      cost_fp: 0.8
      cost_fn: 25
      benefit_tp: 25
      note: Custo de envio (0,8€) vs margem de uma resposta (25€).
    pitfalls:
      - Prever resposta ≠ prever o efeito da campanha (uplift). Clientes que comprariam de qualquer forma inflacionam o ROI.
      - Usar features calculadas após o envio.
    powerbi_output:
      table: Propensao_Campanha
      columns: [cliente_id, probabilidade, decil, incluir_envio, versao_modelo]
      visuals:
        - Curva de ganhos acumulados (lift chart)
        - ROI simulado por % da base contactada
      measures:
        - name: Respostas Esperadas
          dax: "Respostas Esperadas = SUM(Propensao_Campanha[probabilidade])"
    ai_act_risk: mínimo
    sensitive_attributes: [idade]
    terms: [propensao, uplift, lift, curva_ganhos, pr_auc, grupo_controlo]

  # ------------------------------------------------------------------ COMERCIAL
  - id: previsao_vendas
    name: Previsão de vendas
    area: comercial
    areas: [comercial, operacoes, financas]
    problem_type: forecasting
    maturity: intermédio
    summary: Prever receita/unidades por loja e família de produto para as próximas semanas.
    business_question: Quanto vamos vender nas próximas 4 semanas, por loja e família?
    decision: Definir objetivos comerciais, planear stock e equipas, e antecipar desvios ao orçamento.
    unit: Loja × família × dia
    target:
      column: receita
      definition: Receita diária agregada por série (loja × família).
    horizon: 28 dias
    typical_features:
      - Histórico da própria série (lags e médias móveis)
      - Calendário (dia da semana, mês, feriados)
      - Promoções e descontos planeados
      - Preço médio
    data_requirements:
      - Pelo menos 2 ciclos sazonais completos (2 anos para sazonalidade anual)
      - Datas contínuas (sem buracos) por série
    demo:
      connector: demo
      workspace: ws-comercial
      dataset: ds-vendas
      table: VendasDiarias
      time_column: data
      value_column: receita
      series_columns: [loja]
      freq: D
      horizon: 28
    recommended_models:
      - model: gbm_lags
        why: Modelo global que aprende com todas as séries e usa promoções/feriados.
      - model: holt_winters
        why: Captura tendência e sazonalidade semanal de forma robusta.
      - model: seasonal_naive
        why: Base obrigatória — qualquer modelo tem de a bater.
      - model: sarima
        why: Clássico estatístico com intervalos de confiança.
    metrics:
      primary: wape
      secondary: [mae, bias, mase]
      business: Erro em euros agregado por semana e enviesamento (sobre/subestimação).
    profile:
      seasonality: semanal e anual
      goal: equilibrado
    pitfalls:
      - Validar com dados aleatórios em vez de backtesting temporal.
      - Ignorar o efeito de promoções e feriados.
      - Comparar modelos sem uma base naive sazonal.
    powerbi_output:
      table: Previsao_Vendas
      columns: [data, serie, previsao, limite_inferior, limite_superior, modelo, versao_modelo]
      visuals:
        - Gráfico de linhas real vs previsto com banda de confiança
        - Desvio previsão vs orçamento por loja
      measures:
        - name: Previsão Total
          dax: "Previsão Total = SUM(Previsao_Vendas[previsao])"
        - name: Desvio vs Orçamento
          dax: "Desvio vs Orçamento = [Previsão Total] - SUM(Orcamento[valor])"
    ai_act_risk: mínimo
    sensitive_attributes: []
    terms: [serie_temporal, sazonalidade, backtesting, wape, naive_sazonal, horizonte_previsao, lag]

  - id: lead_scoring
    name: Lead scoring (probabilidade de conversão)
    area: comercial
    areas: [comercial, marketing]
    problem_type: binary_classification
    maturity: básico
    summary: Priorizar leads com maior probabilidade de se tornarem clientes.
    business_question: Em que leads deve a equipa comercial investir tempo primeiro?
    decision: Ordenar a fila de leads e atribuir os melhores aos comerciais com mais capacidade.
    unit: Lead
    target:
      column: converteu
      definition: 1 se o lead originou um contrato/venda em até 90 dias.
      positive_class: 1
    horizon: 90 dias
    typical_features:
      - Origem do lead e setor
      - Dimensão da empresa e cargo do contacto
      - Envolvimento (emails abertos, visitas ao site, pedido de demo)
      - Tempo até ao primeiro contacto
    data_requirements:
      - Leads com resultado final conhecido (convertido / perdido)
    demo:
      connector: demo
      workspace: ws-comercial
      dataset: ds-crm
      table: Leads
      target: converteu
      id_columns: [lead_id]
    recommended_models:
      - model: lightgbm
        why: Bom desempenho com mistura de variáveis categóricas e numéricas.
      - model: logistic_regression
        why: Pontuação explicável que a equipa comercial entende.
      - model: random_forest
        why: Robusto e estável.
    metrics:
      primary: roc_auc
      secondary: [pr_auc, lift_top_decile, precision]
      business: Taxa de conversão nos leads priorizados vs média.
    profile:
      interpretability: alta
      imbalance: moderado
      goal: equilibrado
    business_costs:
      cost_fp: 40
      cost_fn: 300
      benefit_tp: 300
      note: Custo de tempo comercial num lead (40€) vs margem média de um contrato (300€).
    pitfalls:
      - Leads ainda em aberto não podem entrar no treino como "não convertidos".
      - O responsável comercial pode refletir política de atribuição e não qualidade do lead.
    powerbi_output:
      table: Lead_Score
      columns: [lead_id, score, banda, principais_motivos, versao_modelo]
      visuals:
        - Funil por banda de score
        - Tabela de leads priorizados por comercial
      measures:
        - name: Conversões Esperadas
          dax: "Conversões Esperadas = SUM(Lead_Score[score])"
    ai_act_risk: mínimo
    sensitive_attributes: []
    terms: [propensao, auc_roc, lift, limiar_decisao]

  - id: cross_sell
    name: Propensão a cross-sell
    area: comercial
    areas: [comercial, marketing]
    problem_type: binary_classification
    maturity: intermédio
    summary: Identificar clientes com maior probabilidade de aderir a um produto adicional.
    business_question: Que clientes vão aderir ao produto adicional se lhes for proposto?
    decision: Selecionar clientes para ofertas de cross-sell e preparar o argumentário comercial.
    unit: Cliente
    target:
      column: aderiu_cross_sell
      definition: 1 se o cliente aderiu a um produto adicional nos 6 meses seguintes.
      positive_class: 1
    horizon: 6 meses
    typical_features: [Produtos atuais, RFM, Plano, Utilização da app, Segmento]
    data_requirements: [Histórico de adesões a produtos com data]
    demo:
      connector: demo
      workspace: ws-comercial
      dataset: ds-crm
      table: Clientes
      target: aderiu_cross_sell
      id_columns: [cliente_id]
      exclude: [churn, valor_futuro_12m]
    recommended_models:
      - model: lightgbm
        why: Bom com desequilíbrio (≈12%) e interações.
      - model: logistic_regression
        why: Interpretável para o argumentário comercial.
      - model: extra_trees
        why: Alternativa rápida e com baixa variância.
    metrics:
      primary: pr_auc
      secondary: [roc_auc, lift_top_decile]
      business: Adesões incrementais por contacto realizado.
    profile:
      interpretability: média
      imbalance: forte
      goal: equilibrado
    business_costs: {cost_fp: 5, cost_fn: 60, benefit_tp: 60}
    pitfalls:
      - Clientes que já têm o produto devem ser excluídos da população.
    powerbi_output:
      table: Propensao_CrossSell
      columns: [cliente_id, probabilidade, decil, versao_modelo]
      visuals: [Lift por decil, Lista de clientes priorizados]
      measures:
        - name: Adesões Esperadas
          dax: "Adesões Esperadas = SUM(Propensao_CrossSell[probabilidade])"
    ai_act_risk: mínimo
    sensitive_attributes: [genero, idade]
    terms: [propensao, pr_auc, desequilibrio_classes, lift]

  - id: cabaz_compras
    name: Análise de cabaz (regras de associação)
    area: comercial
    areas: [comercial, pricing, marketing]
    problem_type: association_rules
    maturity: básico
    summary: Descobrir produtos comprados em conjunto para layout de loja, promoções e recomendações.
    business_question: Que produtos são comprados em conjunto com mais frequência do que o acaso?
    decision: Definir promoções cruzadas, disposição em loja e recomendações online.
    unit: Talão (transação)
    target:
      column: null
      definition: Sem alvo — procura padrões de co-ocorrência.
    horizon: n/a
    typical_features: [Identificador da transação, Produto ou categoria]
    data_requirements:
      - Tabela de linhas de venda com id de talão e produto
      - Milhares de transações para regras fiáveis
    demo:
      connector: demo
      workspace: ws-comercial
      dataset: ds-vendas
      table: LinhasTalao
      transaction_column: talao_id
      item_column: produto
    recommended_models:
      - model: apriori
        why: Algoritmo clássico, transparente e suficiente para centenas de produtos.
    metrics:
      primary: lift
      secondary: [support, confidence]
      business: Aumento do ticket médio nas promoções cruzadas.
    profile:
      interpretability: alta
      goal: interpretabilidade
    pitfalls:
      - Suporte mínimo demasiado baixo gera milhares de regras irrelevantes.
      - Confiança alta com lift ≈ 1 não é associação real (o produto B é comprado por quase todos).
    powerbi_output:
      table: Regras_Associacao
      columns: [antecedente, consequente, suporte, confianca, lift]
      visuals: [Tabela de regras ordenada por lift, Matriz produto × produto]
      measures:
        - name: Nº de Regras Fortes
          dax: "Regras Fortes = CALCULATE(COUNTROWS(Regras_Associacao), Regras_Associacao[lift] > 1.5)"
    ai_act_risk: mínimo
    sensitive_attributes: []
    terms: [regra_associacao, suporte, confianca, lift_associacao, apriori]

  # ------------------------------------------------------------------ FINANÇAS
  - id: atraso_pagamentos
    name: Risco de atraso nos recebimentos
    area: financas
    areas: [financas, risco]
    problem_type: binary_classification
    maturity: intermédio
    summary: Prever faturas que vão ser pagas com mais de 30 dias de atraso.
    business_question: Que faturas emitidas vão ser pagas com atraso superior a 30 dias?
    decision: Priorizar ações de cobrança preventiva e ajustar condições de crédito a clientes.
    unit: Fatura na data de emissão
    target:
      column: atraso_superior_30d
      definition: 1 se a fatura foi paga mais de 30 dias após o vencimento.
      positive_class: 1
    horizon: Até ao pagamento
    typical_features:
      - Histórico de atrasos do cliente
      - Rating interno e antiguidade
      - Valor e prazo da fatura
      - Setor e região
    data_requirements: [Faturas liquidadas com datas de vencimento e pagamento]
    demo:
      connector: demo
      workspace: ws-financas
      dataset: ds-financas
      table: Faturas
      target: atraso_superior_30d
      id_columns: [fatura_id, cliente_id]
      exclude: [dias_atraso]
    recommended_models:
      - model: lightgbm
        why: Capta interações entre histórico do cliente e valor/prazo.
      - model: logistic_regression
        why: Interpretável para a equipa de crédito e cobranças.
      - model: random_forest
        why: Robusto a outliers de valor.
    metrics:
      primary: roc_auc
      secondary: [recall, precision, pr_auc]
      business: Redução do DSO e do valor em atraso.
    profile:
      interpretability: alta
      imbalance: moderado
      goal: equilibrado
    business_costs: {cost_fp: 10, cost_fn: 150, benefit_tp: 100}
    pitfalls:
      - Incluir os dias de atraso efetivos (dias_atraso) como feature — é o próprio alvo.
      - Faturas ainda em aberto não têm resultado conhecido.
    powerbi_output:
      table: Risco_Atraso_Faturas
      columns: [fatura_id, cliente_id, probabilidade, banda_risco, valor, versao_modelo]
      visuals: [Valor em risco por cliente, Aging previsto]
      measures:
        - name: Valor em Risco de Atraso
          dax: "Valor em Risco = SUMX(Risco_Atraso_Faturas, Risco_Atraso_Faturas[probabilidade] * Risco_Atraso_Faturas[valor])"
    ai_act_risk: limitado
    sensitive_attributes: []
    terms: [dso, data_leakage, auc_roc, matriz_custo_beneficio]

  - id: previsao_tesouraria
